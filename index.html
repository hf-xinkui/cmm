        // IP限制和查询记录相关配置
        const LIMIT_CONFIG = {
            maxQueries: 5,          // 同一IP最大查询次数
            limitHours: 1,          // 限制时长（小时）
            expireDays: 7,          // 记录过期天数
            storageKey: 'queryRecords', // 本地存储键名
            ipLimitKey: 'ipLimitRecords' // IP限制记录键名
        };
        // 存储查询记录和IP限制记录
        let queryRecords = JSON.parse(localStorage.getItem(LIMIT_CONFIG.storageKey)) || [];
        let ipLimitRecords = JSON.parse(localStorage.getItem(LIMIT_CONFIG.ipLimitKey)) || {};
        // 获取用户IP（前端模拟）
        function getUserIP() {
            return localStorage.getItem('mockIP') || `192.168.${Math.floor(Math.random()*255)}.${Math.floor(Math.random()*255)}`;
        }
        // 检查IP是否被限制
        function checkIPLimit(ip) {
            if (!ipLimitRecords[ip]) return false;
            
            const limitTime = ipLimitRecords[ip];
            const now = new Date().getTime();
            const limitExpire = limitTime + LIMIT_CONFIG.limitHours * 60 * 60 * 1000;
            
            // 如果限制未过期
            if (now < limitExpire) {
                const remaining = Math.ceil((limitExpire - now) / 60000); // 剩余分钟
                document.getElementById('limitText').textContent = `您的IP查询次数过多，请${remaining}分钟后再试`;
                document.getElementById('ipLimitTip').classList.remove('hidden');
                return true;
            } else {
                // 限制已过期，清除限制
                delete ipLimitRecords[ip];
                localStorage.setItem(LIMIT_CONFIG.ipLimitKey, JSON.stringify(ipLimitRecords));
                return false;
            }
        }
        // 记录查询行为
        function recordQuery(ip, keyword, hasResult) {
            const now = new Date();
            const record = {
                ip: ip,
                keyword: keyword,
                time: now.toLocaleString(),
                timestamp: now.getTime(),
                hasResult: hasResult,
                resultText: hasResult ? '找到记录' : '无匹配记录'
            };
            
            // 添加记录
            queryRecords.push(record);
            
            // 保存到本地存储
            localStorage.setItem(LIMIT_CONFIG.storageKey, JSON.stringify(queryRecords));
            
            // 检查查询次数，达到上限则限制IP
            const ipQueries = queryRecords.filter(r => r.ip === ip && r.timestamp > (now.getTime() - LIMIT_CONFIG.limitHours * 60 * 60 * 1000));
            
            if (ipQueries.length >= LIMIT_CONFIG.maxQueries) {
                ipLimitRecords[ip] = now.getTime();
                localStorage.setItem(LIMIT_CONFIG.ipLimitKey, JSON.stringify(ipLimitRecords));
            }
        }
        // 清理过期记录
        function clearExpiredRecords() {
            const now = new Date().getTime();
            const expireTime = LIMIT_CONFIG.expireDays * 24 * 60 * 60 * 1000;
            
            // 过滤7天内的记录
            queryRecords = queryRecords.filter(record => now - record.timestamp < expireTime);
            
            // 保存清理后的记录
            localStorage.setItem(LIMIT_CONFIG.storageKey, JSON.stringify(queryRecords));
            
            return queryRecords.length;
        }

            termsModal.classList.add('hidden');
            
            // 聚焦输入框
            searchKeywordInput.focus();
            
            // 自动清理过期记录
            clearExpiredRecords();
        }

        // 查询证书信息
        async function queryCertInfo(isQrScan = false, keywordFromQr = "") {
            // 检查IP限制
            const userIP = getUserIP();
            if (checkIPLimit(userIP)) {
                return;
            }
            
            let keyword;
            if(isQrScan){
                // 扫码过来：可以身份证号 / 证书编号都支持
                keyword = keywordFromQr.trim();
            }else{
                // 手动页面输入：仅允许证书编号
                keyword = searchKeywordInput.value.trim();
            }

            // 验证输入
            if (!keyword) {
                errorText.textContent = '请输入证书编号';
                errorTip.classList.remove('hidden');
                return;
            }
            
            // 重置提示
            errorTip.classList.add('hidden');
            searchTip.classList.remove('hidden');
            
            try {
                // 模拟网络延迟
                await new Promise(resolve => setTimeout(resolve, 800));
                
                let results;
                if(isQrScan){
                    //扫码：支持证书编号 OR 身份证号
                    results = certDatabase.filter(item => 
                        item.certNo === keyword || item.idCard === keyword
                    );
                }else{
                    //手动输入：仅匹配证书编号
                    results = certDatabase.filter(item => item.certNo === keyword);
                }
                
                // 记录查询行为
                recordQuery(userIP, keyword, results.length > 0);
                
                // 渲染结果
                renderResults(results, keyword);
            } catch (err) {
                errorText.textContent = '查询出错，请稍后重试';
                errorTip.classList.remove('hidden');
                resultSection.classList.add('hidden');
                noResultSection.classList.add('hidden');
            } finally {
                searchTip.classList.add('hidden');
            }
        }
        // 渲染查询结果，新增证书类型字段
        function renderResults(results, keyword) {
            queryKeyword.textContent = `查询关键词：${keyword}`;
            resultContent.innerHTML = '';
            if (results.length === 0) {
                // 无结果
                resultSection.classList.add('hidden');
                noResultSection.classList.remove('hidden');
                return;
            }
            // 生成结果卡片
            results.forEach(result => {
                const card = document.createElement('div');
                card.className = 'p-4 border border-gray-100 rounded-lg card-hover mb-4';
                
                const cardContent = `
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-base">
                        <div>
                            <span class="text-gray-500">证书编号：</span>
                            <span class="text-gray-800 font-medium">${result.certNo}</span>
                        </div>
                        <div>
                            <span class="text-gray-500">证书类型：</span>
                            <span class="text-gray-800 font-medium">${result.certType}</span>
                        </div>
                        <div>
                            <span class="text-gray-500">身份证号：</span>
                            <span class="text-gray-800 font-medium">${maskIdCard(result.idCard)}</span>
                        </div>
                        <div>
                            <span class="text-gray-500">姓名：</span>
                            <span class="text-gray-800 font-medium">${result.name}</span>
                        </div>
                        <div>
                            <span class="text-gray-500">发证日期：</span>
                            <span class="text-gray-800 font-medium">${result.issueDate}</span>
                        </div>
                        <div class="md:col-span-2">
                            <span class="text-gray-500">有效期：</span>
                            <span class="text-gray-800 font-medium">${result.validity}</span>
                        </div>
                    </div>
                `;
                
                card.innerHTML = cardContent;
                resultContent.appendChild(card);
            });
            resultSection.classList.remove('hidden');
            noResultSection.classList.add('hidden');
        }
        // 身份证号脱敏处理
        function maskIdCard(idCard) {
            if (idCard.length === 18) {
                return idCard.replace(/(\d{6})\d{8}(\d{4})/, '$1********$2');
            }
            return idCard;
        }
        // 打开条款弹窗
        function openTermsModal(type) {
            if (type === 'privacy') {
                modalTitle.textContent = '隐私政策';
                modalContent.textContent = termsData.privacyPolicy;
            } else {
                modalTitle.textContent = '服务条款';
                modalContent.textContent = termsData.serviceTerms;
            }
            termsModal.classList.remove('hidden');
        }
        // 绑定事件
        // 查询按钮：手动输入查询，只匹配证书编号
        searchBtn.addEventListener('click', ()=>{
            queryCertInfo(false,"");
        });
        resetBtn.addEventListener('click', initPage);
        retryBtn.addEventListener('click', initPage);
        
        // 回车查询
        searchKeywordInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                queryCertInfo(false,"");
            }
        });
        // 条款相关事件
        privacyLink.addEventListener('click', (e) => {
            e.preventDefault();
            openTermsModal('privacy');
        });
        termsLink.addEventListener('click', (e) => {
            e.preventDefault();
            openTermsModal('service');
        });
        closeModalBtn.addEventListener('click', () => {
            termsModal.classList.add('hidden');
        });
        // 页面加载初始化
        window.addEventListener('DOMContentLoaded', () => {
            initPage();
            // 自动清理过期记录
            clearExpiredRecords();

            // ====== 二维码扫码自动查询逻辑 ======
            const urlParams = new URLSearchParams(window.location.search);
            const sn = urlParams.get('sn');
            if(sn){
                searchKeywordInput.value = sn;
                //扫码模式：支持身份证/证书编号
                queryCertInfo(true, sn);
            }
        });
        // 定时清理过期记录（每24小时）
        setInterval(clearExpiredRecords, 24 * 60 * 60 * 1000);
    </script>
</body>
</html>
